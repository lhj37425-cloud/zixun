[project]
name = "daily-dissect"
version = "0.1.0"
description = "今日一拆：每日 AI 前沿精选 + 项目拆解的个人学习系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
dd = "daily_dissect.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_dissect"]

[tool.uv]
# uv 的下载缓存在 C 盘、项目在 D 盘，跨盘不能用硬链接，直接复制文件，免得每次都弹警告
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
